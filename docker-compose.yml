# Local databases. Two SEPARATE Postgres servers, so tests can never reach development data.
#   pnpm db:up        start both        pnpm db:up:test   start only the test server
#   pnpm db:down      stop both (the dev data survives in a volume; the test server keeps nothing)
name: edu-service

services:
  # SNS/SQS-compatible local AWS endpoint. Opt in with `pnpm events:up`.
  localstack:
    image: localstack/localstack:4.12.0
    profiles: [events]
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 0
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Development database: what the CLI uses. Its data survives restarts.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_service
    ports: ["127.0.0.1:5432:5432"] # bound to localhost only: the passwords here are not secret
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edu_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Test database: a different server on a different port, kept in memory and thrown away on stop.
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: edu_service_test
      POSTGRES_PASSWORD: edu_service_test
      POSTGRES_DB: edu_service_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    # Safe ONLY because the data is disposable: trade durability for speed.
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_service_test -d edu_service_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
    name: edu-service-pgdata
  localstack-data:
    name: edu-service-localstack-data
